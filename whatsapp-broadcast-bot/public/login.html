<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — WA Broadcast Control Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080b11;
      --surface: rgba(15, 20, 30, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --accent-hover: #6d28d9;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      animation: float 8s ease-in-out infinite;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: var(--accent);
      top: -100px;
      left: -100px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: #0ea5e9;
      bottom: -80px;
      right: -80px;
      animation-delay: -4s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(30px, 20px);
      }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      animation: slideUp 0.5s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(32px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .logo-wrap img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 12px;
    }

    .logo-texts .brand {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .logo-texts .sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: block;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill 0.2s;
      z-index: 1;
    }

    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      padding: 13px 44px 13px 44px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-sizing: border-box;
    }

    input:focus {
      border-color: var(--accent);
      background: rgba(124, 58, 237, 0.08);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .eye-btn {
      position: absolute;
      left: 300px;

      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.2s;
      z-index: 2;
    }

    .eye-btn:hover {
      color: var(--text);
    }

    .eye-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .error-msg {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      color: #fca5a5;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .error-msg.show {
      display: flex;
      animation: shake 0.35s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), #9333ea);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      padding: 14px;
      margin-top: 8px;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(255, 255, 255, 0.12), transparent);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px var(--accent-glow);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .btn.loading .spinner {
      display: block;
    }

    .btn.loading .btn-text {
      opacity: 0.7;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .footer-note strong {
      color: var(--text);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo.png" alt="Logo" />
      <div class="logo-texts">
        <div class="brand">Broadcast AI</div>
        <div class="sub">Command Center</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access the control dashboard.</p>

    <div class="error-msg" id="error-msg">
      <svg viewBox="0 0 24 24" width="16" height="16" style="fill:currentColor;flex-shrink:0">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
      </svg>
      <span id="error-text">Invalid username or password.</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
          </svg>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter username"
            required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap" style="position:relative;">
          <svg viewBox="0 0 24 24">
            <path
              d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
          </svg>
          <input type="password" id="password" name="password" autocomplete="current-password"
            placeholder="Enter password" required />
          <button type="button" class="eye-btn" title="Show/hide password">
            <svg id="eye-icon" viewBox="0 0 30 20 ">
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn" id="login-btn">
        <div class="btn-inner">
          <div class="spinner"></div>
          <span class="btn-text">Sign In</span>
        </div>
      </button>
    </form>

    <div class="footer-note">
      Default credentials: <strong>admin</strong> / <strong>admin123</strong><br />
      Change them in your <strong>.env</strong> file.
    </div>
  </div>

  <script src="/login.js"></script>
</body>

</html>
